<div class="flex flex-col p-4 items-center justify-center">
  <h2 class="text-2xl md:text-4xl text-center mb-4 md:my-4">Preguntas Frecuentes</h2>
</div>
<div id="content" class="py-10 px-10 md:px-20 lg:px-50 card flex justify-center">
  <div class="mt-8 flex flex-col gap-16 md:gap-8 md:w-[60%]">
    @for (faq of faqs; track $index) {
    <div
      class="zc--tip p-4 md:p-8 shadow-lg [perspective:1000px] transition-transform duration-100 [transform-style:preserve-3d]"
      [ngClass]="{ 'zc--even': $index % 2 === 0, 'zc--odd': $index % 2 !== 0 }"
      (click)="goToDetails(faq)"
      (keydown)="goToDetails(faq)"
    >
      <p class="text-white text-center text-xl md:text-2xl">
        {{ faq.title }}
      </p>
    </div>
    }
  </div>
  <div class="hidden md:block md:w-[40%]">
  </div>
</div>

<p-card class="my-4" id="form-contact">
  <ng-template #title>
    <span>Contacto</span>
    <p-divider />
  </ng-template>
  <p-floatlabel>
    <input pInputText [formControl]="fcEmail" id="email" name="email" class="w-full" />
    <label for="email">Correo Electrónico</label>
  </p-floatlabel>
</p-card>

<p-card class="my-4" id="form-shipping">
  <ng-template #title>
    <span>Envío</span>
    <p-divider />
  </ng-template>
  <form [formGroup]="fgShipping" class="flex flex-col gap-8">
    <p-selectbutton
      [options]="kindOfPersonOptions"
      formControlName="kindOfPerson"
      optionLabel="label"
      optionValue="value"
      aria-labelledby="basic"
      [invalid]="kindOfPerson === null"
    />
    <p-floatlabel>
      <p-inputmask
        [mask]="nationalIdInputMask"
        formControlName="nationalId"
        id="shippingNationalId"
        name="nationalId"
        styleClass="w-full"
      />
      <label for="nationalId">Documento de Identidad</label>
    </p-floatlabel>
    <p-floatlabel>
      <input
        pInputText
        formControlName="fullName"
        id="shippingFullName"
        name="fullName"
        class="w-full"
        readonly
      />
      <label for="fullName">Nombre Completo</label>
    </p-floatlabel>

    <p-inputgroup>
      <p-floatlabel>
        <input
          pInputText
          formControlName="firstName"
          id="firstName"
          name="firstName"
          class="w-full"
        />
        <label for="firstName">Primer Nombre</label>
      </p-floatlabel>
      <p-floatlabel>
        <input
          pInputText
          formControlName="secondName"
          id="secondName"
          name="secondName"
          class="w-full"
        />
        <label for="secondName">Segundo Nombre</label>
      </p-floatlabel>
    </p-inputgroup>

    <p-floatlabel>
      <input pInputText formControlName="lastName" id="lastName" name="lastName" class="w-full" />
      <label for="lastName">Apellidos</label>
    </p-floatlabel>
    <p-divider />
    <p-floatlabel>
      <p-inputmask
        mask="(999) 999-9999"
        formControlName="phoneNumber"
        id="shippingSecondLastName"
        class="w-full"
      />
      <label for="phoneNumber">Celular de quien recibe</label>
    </p-floatlabel>
    <p-inputgroup>
      <p-floatlabel>
        <input
          pInputText
          readonly
          formControlName="state"
          id="shippingState"
          name="state"
          class="w-full"
          readOnly
        />
        <label for="state">Departamento</label>
      </p-floatlabel>

      <p-floatlabel>
        <p-autocomplete
          formControlName="city"
          id="shippingCity"
          name="city"
          [suggestions]="optionsCities"
          (completeMethod)="filterCountry($event)"
          [dropdown]="true"
          dropdownAriaLabel="Desplegable de ciudades"
          optionLabel="name"
          optionValue="name"
        />
        <label for="state">Ciudad</label>
      </p-floatlabel>
    </p-inputgroup>
    <p-floatlabel>
      <input pInputText id="address" name="address" formControlName="address" class="w-full" />
      <label for="address">Dirección de facturación</label>
    </p-floatlabel>
  </form>
</p-card>

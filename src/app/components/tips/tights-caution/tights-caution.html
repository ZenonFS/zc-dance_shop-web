<h2 class="text-4xl text-center m-8">¿Cómo cuidar adecuadamente las medias?</h2>
<div class="flex flex-col gap-6 mb-6">
  @for (section of sections; track $index) {
  <div
    class="bg-black p-4 rounded-xl md:px-8 md:py-6 w-fit shadow-lg"
  >
    <span class="text-white text-2xl md:text-3xl font-bold">
      {{ section.title }}
    </span>
  </div>
  <ul>
    @for (item of section.items; track $index) {
    <li class="text-lg md:text-xl">{{ item }}</li>
    }
  </ul>
  }
</div>

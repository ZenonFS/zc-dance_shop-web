<div
  pAnimateOnScroll
  [once]="false"
  [enterClass]="enterClass"
  [leaveClass]="leaveClass"
  class="flex flex-col gap-8 items-center justify-center"
>
  <div
    #cardMpa
    class="rounded-full shadow-lg shadow-cyan-500/50 flex items-center justify-center overflow-hidden h-[15rem] md:h-[20rem] xl:h-[30rem] w-[10em] md:w-[12em] xl:w-[20em] [perspective:1000px] transition-transform duration-100 [transform-style:preserve-3d]"
    (mousemove)="onMouseMove($event, cardMpa)"
    (mouseleave)="onMouseLeave(cardMpa)"
  >
    @if (imageSrc) {
    <img
      [src]="imageSrc"
      alt="catalogo-medias-zc"
      class="h-[100%]"
      (click)="navigateTo()"
      (keydown)="navigateTo()"
    />
    } @else {
    <p-skeleton height="100%"></p-skeleton>

    }
  </div>
  @if (title) {
  <h3 class="text-2xl text-center ver-mas font-advent-pro" (click)="navigateTo()" (keydown)="navigateTo()">
    {{ title }}
  </h3>
  } @else {
  <p-skeleton></p-skeleton>
  }
</div>

<p-toast appendTo="body" />
<div
  id="zc--img-container"
  class="relative h-[20rem] flex items-center justify-center justify-content-center overflow-hidden"
>
  @if (imagesUrl) {
  <p-carousel
    [value]="imagesUrl"
    [numVisible]="1"
    [numScroll]="1"
    [circular]="false"
    [showIndicators]="false"
    [showNavigators]="showNavigators"
    [responsiveOptions]="responsiveOptions"
    class="h-full"
  >
    <ng-template let-image #item>
      <div
        class="relative h-[20rem] flex items-center justify-center"
        (click)="goToDetails()"
        (keydown)="goToDetails()"
      >
        <img
          [src]="image.url ?? '/zc.png'"
          alt="ZC Imágen de Producto"
          class="relative object-cover z-110"
        />
        <img
          [src]="image.url ?? '/zc.png'"
          alt="ZC Imágen de Producto de fondo"
          class="zc--bg-blur absolute object-cover w-full blur-md z-100"
        />
      </div>
    </ng-template>
  </p-carousel>
  @if(!canBuyProduct) {
  <p-tag
    value="Sin existencias"
    severity="danger"
    [rounded]="true"
    class="absolute dark:!bg-surface-900"
    [style.left.px]="8"
    [style.top.px]="8"
  />
  } } @else {
  <p-skeleton height="20rem" />
  } @if(canBuyProduct) {
  <p-button
    id="add-product"
    [aria-label]="btnLabel"
    [label]="btnLabel"
    icon="pi pi-shopping-bag"
    class="z-100"
    (onClick)="addProductToCart()"
  ></p-button>
  }
</div>
<div id="details" class="flex flex-col p-6 gap-2" (click)="goToDetails()" (keydown)="goToDetails()">
  @if (name) {
  <span class="font-bold text-xl">{{ name }}</span>
  } @else {
  <p-skeleton />
  } @if (price) {
  <span>{{ price | currency }}</span>
  } @else {
  <p-skeleton width="10rem" height="3rem" />
  }
</div>

<p-dialog
  header="Selecciona una variante"
  appendTo="body"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '25rem' }"
>
  <span class="p-text-secondary block mb-8"
    >Seleccione una variante del producto para agregarlo al carrito.</span
  >
  <div class="flex flex-col items-center gap-4 mb-4">
    <p-listbox
      [(ngModel)]="selectedVariant"
      [options]="sizes"
      optionLabel="value"
      optionValue="id"
      [checkmark]="true"
      [highlightOnSelect]="true"
      class="w-full"
    />

    <p-inputNumber
      class="h-8"
      [(ngModel)]="amount"
      [min]="1"
      [inputStyle]="{ width: '3rem' }"
      [showButtons]="true"
      buttonLayout="horizontal"
    >
      <ng-template #incrementbuttonicon>
        <span class="pi pi-plus"></span>
      </ng-template>
      <ng-template #decrementbuttonicon>
        <span class="pi pi-minus"></span>
      </ng-template>
    </p-inputNumber>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Cancelar" severity="secondary" (click)="visible = false" />
    <p-button label="Confirmar" (click)="confirmAddToCart()" />
  </div>
</p-dialog>
